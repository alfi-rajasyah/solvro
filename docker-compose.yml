# Solvro — single-file deployment.
# Usage on a fresh server with Docker installed:
#   1. Save this file as docker-compose.yml in any directory
#   2. Run: docker compose up -d
# That's it. No .env file, no editing, no secrets to manage.
#
# WARNING: the secrets below are demo defaults. They are committed to
# the public compose file and known to anyone who reads the repo.
# Suitable for private-LAN demos. NOT suitable for public internet.
# Before exposing this to the internet, replace POSTGRES_PASSWORD,
# JWT_SECRET, and tighten CORS_ORIGIN to a specific domain.

services:
  postgres:
    image: postgres:15-alpine
    container_name: solvro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solvro
      POSTGRES_PASSWORD: solvro_demo_password
      POSTGRES_DB: solvro
    volumes:
      - solvro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvro -d solvro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/alfi-rajasyah/solvro-backend:latest
    container_name: solvro-backend
    restart: unless-stopped
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://solvro:solvro_demo_password@postgres:5432/solvro?schema=public
      JWT_SECRET: solvro-demo-jwt-secret-not-for-production-use-32chars-minimum-here
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"

  frontend:
    image: ghcr.io/alfi-rajasyah/solvro-frontend:latest
    container_name: solvro-frontend
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  solvro_pgdata:
    name: solvro_pgdata
