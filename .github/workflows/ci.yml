name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repo; never grant the default token more.
permissions:
  contents: read

env:
  # bcrypt ships a prebuilt binary download as part of `npm ci`; that
  # download flakes transiently on GitHub's runners. Retrying the whole
  # `npm ci` once is cheaper than diagnosing a specific transient host.
  NPM_CI_RETRY_SLEEP: 10

jobs:
  # Fast-feedback gate: surfaces type errors in ~2 minutes instead of burying
  # them inside the e2e job's Docker image builds. Covers all three packages,
  # including the e2e suite whose typecheck is not exercised anywhere else.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: npm ci (backend, retry once on failure)
        working-directory: backend
        run: |
          npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci)

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: npm ci (frontend, retry once on failure)
        working-directory: frontend
        run: |
          npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci)

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: npm ci (e2e, retry once on failure)
        working-directory: e2e
        run: |
          npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci)

      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: solvro
          # Ephemeral service-container password. Supplied from a repo
          # Actions secret so no credential literal lives in the repo.
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: solvro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvro -d solvro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://solvro:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/solvro?schema=public
    steps:
      - uses: actions/checkout@v7

      # Generate a throwaway JWT secret per run — never stored in the repo.
      - name: Generate ephemeral JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm ci (backend, retry once on failure)
        working-directory: backend
        run: |
          npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci)

      - name: Prisma migrate deploy
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run backend test suite
        working-directory: backend
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Consumed by ci/docker-compose.ci.yml via ${VAR} interpolation and by
      # the admin-creation / Playwright steps below. Passwords come from repo
      # Actions secrets; JWT_SECRET is generated per run (step below).
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      ADMIN_EMAIL: qa@solvro.test
      ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate ephemeral JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build and start stack (retry once on failure)
        run: |
          docker compose -f ci/docker-compose.ci.yml up -d --build || (
            echo "docker compose up failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && \
            sleep "$NPM_CI_RETRY_SLEEP" && \
            docker compose -f ci/docker-compose.ci.yml up -d --build
          )

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3300/health; then
              echo "backend healthy"
              exit 0
            fi
            if [ "$(docker compose -f ci/docker-compose.ci.yml ps -q backend | xargs -r docker inspect -f '{{.State.Status}}')" = "exited" ]; then
              echo "backend container exited — failing fast instead of waiting out the timeout"
              break
            fi
            echo "waiting for backend... ($i)"
            sleep 2
          done
          echo "backend did not become healthy in time"
          exit 1

      - name: Create e2e admin user
        run: |
          docker compose -f ci/docker-compose.ci.yml exec -T \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            backend npx tsx scripts/create-admin.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: npm ci (e2e, retry once on failure)
        working-directory: e2e
        run: |
          npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci)

      - name: Install Playwright browsers (chromium)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          CI: "true"
        run: npx playwright test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f ci/docker-compose.ci.yml logs --no-color --tail 100

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f ci/docker-compose.ci.yml down -v
