name: CI

# What runs where. The repo is public, so runner minutes are free; the
# limit that matters is the 20 jobs GitHub runs at once, and every path
# below stays at or under 20 jobs.
# - PR into develop: typecheck, frontend tests (two time zones), backend
#   tests (2 shards), desktop e2e (12 shards). This is the merge gate.
# - PR into main (the release PR from develop), push to main, manual run:
#   the same checks, plus mobile e2e, with desktop in 8 shards and mobile in
#   6. These runs build both images from their Dockerfiles, so the release
#   path tests the exact images docker-publish.yml ships.
# - Push to develop does not run: every change reached it through a tested PR,
#   and nothing publishes from develop.
# - Draft PRs wait until they are marked ready; docs-only changes never run.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "notes/**"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "notes/**"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repo; never grant the default token more.
permissions:
  contents: read

env:
  # bcrypt ships a prebuilt binary download as part of `npm ci`; that
  # download flakes transiently on GitHub's runners. Retrying the whole
  # `npm ci` once is cheaper than diagnosing a specific transient host.
  NPM_CI_RETRY_SLEEP: 10
  # A registry connection that hangs otherwise sits out npm's default
  # 5-minute fetch timeout before the first retry — seen as "added 6
  # packages in 7m" on three runs in a row. Fail a request after 60s and
  # retry more often instead; every tarball this repo fetches is small.
  npm_config_fetch_timeout: "60000"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "30000"

# node_modules caching: every job restores node_modules itself, keyed on the
# lock file hash, and runs `npm ci` only on a miss. A hit takes about 5 s;
# `npm ci` took 34–62 s even with the npm download cache. A lock file change
# misses once and the next run hits.

jobs:
  # Fast-feedback gate: type errors, lint, the production build and the
  # bundle-size check for all three packages. The frontend test suite runs in
  # its own jobs below, so this one finishes in under a minute on a cache hit.
  typecheck:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            e2e/node_modules
          key: nm-all-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json', 'e2e/package-lock.json') }}

      - name: npm ci on a cache miss (retry once on failure)
        if: steps.nm.outputs.cache-hit != 'true'
        run: |
          for p in backend frontend e2e; do
            (cd "$p" && { npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci); }) || exit 1
          done

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc -p tsconfig.check.json

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend (React hooks rules)
        working-directory: frontend
        run: npm run lint

      # Route-level code splitting keeps the entry chunk under 1 MB; this fails
      # the build if a static import pulls a heavy page back into it. `npx vite
      # build` skips the `tsc -b` that `npm run build` would repeat.
      - name: Build frontend and check bundle size
        working-directory: frontend
        run: |
          npx vite build
          npm run check:bundle-size

      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck

  # The second run is east of UTC: the date-contract invariant (dateField.ts,
  # UTC-midnight serialization) is invisible under a UTC clock — Asia/Jakarta
  # is the zone that exposed the original walk-back bug and the only run that
  # can catch a regression. The two runs are separate jobs so they overlap.
  frontend-tests:
    name: frontend-tests (${{ matrix.tz }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Jakarta]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: nm-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: npm ci on a cache miss (retry once on failure)
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci)

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test
        env:
          TZ: ${{ matrix.tz }}

  # Two shards, each with its own Postgres service, so the suite keeps its
  # one-file-at-a-time rule (vitest.config.ts, fileParallelism: false) inside
  # each shard while the shards run side by side.
  backend-tests:
    name: backend-tests (${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: solvro
          # Deliberate literal, not a secret. A service container's `env:` is
          # resolved before any step runs, so a per-run generated value is
          # impossible here — and secrets are unavailable to Dependabot-
          # triggered runs (GitHub passes only the Dependabot secret store to
          # those, which is why every Dependabot PR failed with "Database is
          # uninitialized and superuser password is not specified").
          # This database lives and dies inside one job on a throwaway runner
          # and is reachable only on localhost, so the value protects nothing
          # and granting it secret status bought no security.
          POSTGRES_PASSWORD: ci-ephemeral-postgres
          # _test suffix required: the backend test globalSetup hard-refuses
          # to truncate any database whose name doesn't end in "_test".
          POSTGRES_DB: solvro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvro -d solvro_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Must match the service-container literal above.
      DATABASE_URL: postgresql://solvro:ci-ephemeral-postgres@localhost:5432/solvro_test?schema=public
    steps:
      - uses: actions/checkout@v4

      # Generate throwaway secrets per run — never stored in the repo.
      - name: Generate ephemeral secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SECRETS_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: nm-backend-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: npm ci on a cache miss (retry once on failure)
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci)

      # Always regenerated: the cached node_modules can hold a client built
      # from an older schema.prisma.
      - name: Prisma generate and migrate deploy
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run backend test suite (shard ${{ matrix.shard }}/2)
        working-directory: backend
        run: npx vitest run --shard=${{ matrix.shard }}/2

  # Keeps the BuildKit layer cache current for the e2e image builds. It runs
  # beside the gate, never in front of it: a cache export costs about 70 s,
  # which used to sit on the first e2e shard and make it the slowest one.
  image-cache:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Export backend image layers
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Export frontend image layers
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # One job per shard, each on its own stack and database. Each job keeps
  # Playwright's single worker: the specs share one database and assert
  # deltas against it, which two workers on one stack would race.
  # Playwright splits the suite by spec file (fullyParallel is off), so a
  # spec file never shares a stack with a file it was not tested beside.
  # Splitting by test (`--fully-parallel`) was measured faster (140 s) but
  # broke kanban-dnd.spec.ts G1/G2, which depend on the state earlier tests
  # in the same file leave behind; it stays off until those tests are
  # independent.
  # Image builds:
  # - PR into develop: the frontend is built on the runner (`vite build`) and
  #   copied into an nginx image with the production nginx.conf and security
  #   headers; the backend image builds from its Dockerfile in parallel.
  # - Release path (everything else): both images build from their
  #   Dockerfiles, in parallel, so the shipped images are what e2e tests.
  # Both read the BuildKit layer cache that `image-cache` writes.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'develop' && '[{"project":"desktop","shard":1,"total":12},{"project":"desktop","shard":2,"total":12},{"project":"desktop","shard":3,"total":12},{"project":"desktop","shard":4,"total":12},{"project":"desktop","shard":5,"total":12},{"project":"desktop","shard":6,"total":12},{"project":"desktop","shard":7,"total":12},{"project":"desktop","shard":8,"total":12},{"project":"desktop","shard":9,"total":12},{"project":"desktop","shard":10,"total":12},{"project":"desktop","shard":11,"total":12},{"project":"desktop","shard":12,"total":12}]' || '[{"project":"desktop","shard":1,"total":8},{"project":"desktop","shard":2,"total":8},{"project":"desktop","shard":3,"total":8},{"project":"desktop","shard":4,"total":8},{"project":"desktop","shard":5,"total":8},{"project":"desktop","shard":6,"total":8},{"project":"desktop","shard":7,"total":8},{"project":"desktop","shard":8,"total":8},{"project":"mobile","shard":1,"total":6},{"project":"mobile","shard":2,"total":6},{"project":"mobile","shard":3,"total":6},{"project":"mobile","shard":4,"total":6},{"project":"mobile","shard":5,"total":6},{"project":"mobile","shard":6,"total":6}]') }}
    env:
      ADMIN_EMAIL: qa@solvro.test
      RELEASE_PATH: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'develop') }}
    steps:
      - uses: actions/checkout@v4

      # Generated per run rather than read from the repo secret store, and
      # exported via $GITHUB_ENV so every later step sees them: docker compose
      # interpolation in ci/docker-compose.ci.yml, the admin-creation step,
      # and Playwright's fixtures (e2e/fixtures/test.ts reads ADMIN_PASSWORD
      # from the environment).
      #
      # This is what makes Dependabot PRs work. GitHub passes only the
      # Dependabot secret store to Dependabot-triggered runs, so every
      # `secrets.CI_*` reference resolved to an empty string and the stack
      # failed to boot. Generating the values removes that whole class of
      # failure and keeps human and bot PRs on an identical path — while
      # being strictly better hygiene than a stored credential, since these
      # now never outlive the job.
      - name: Generate ephemeral run credentials
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SECRETS_KEY=$(openssl rand -base64 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            e2e/node_modules
          key: nm-e2e-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}

      - name: npm ci on a cache miss (retry once on failure)
        if: steps.nm.outputs.cache-hit != 'true'
        run: |
          for p in frontend e2e; do
            (cd "$p" && { npm ci || (echo "npm ci failed, retrying once after ${NPM_CI_RETRY_SLEEP}s..." && sleep "$NPM_CI_RETRY_SLEEP" && npm ci); }) || exit 1
          done

      - uses: docker/setup-buildx-action@v3

      # Exposes the Actions cache service to the plain `docker buildx` calls
      # below, which run in the background so the two builds overlap.
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build images
        run: |
          docker buildx build backend --target runtime --load \
            -t solvro-ci-backend:latest \
            --cache-from type=gha,scope=backend > /tmp/backend-build.log 2>&1 &
          backend_pid=$!
          if [ "$RELEASE_PATH" = "true" ]; then
            docker buildx build frontend --target runtime --load \
              -t solvro-ci-frontend:latest \
              --cache-from type=gha,scope=frontend
          else
            (cd frontend && npx vite build)
            ctx=$(mktemp -d)
            cp -r frontend/dist "$ctx/dist"
            cp frontend/nginx.conf frontend/security-headers.conf "$ctx/"
            printf '%s\n' \
              'FROM nginx:1.27-alpine' \
              'COPY dist /usr/share/nginx/html' \
              'COPY nginx.conf /etc/nginx/conf.d/default.conf' \
              'COPY security-headers.conf /etc/nginx/snippets/solvro-security-headers.conf' \
              > "$ctx/Dockerfile"
            docker build -q -t solvro-ci-frontend:latest "$ctx"
          fi
          if ! wait "$backend_pid"; then cat /tmp/backend-build.log; exit 1; fi

      - name: Start stack
        run: docker compose -f ci/docker-compose.ci.yml up -d --no-build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3300/health; then
              echo
              echo "backend healthy"
              exit 0
            fi
            if [ "$(docker compose -f ci/docker-compose.ci.yml ps -q backend | xargs -r docker inspect -f '{{.State.Status}}')" = "exited" ]; then
              echo "backend container exited — failing fast instead of waiting out the timeout"
              break
            fi
            sleep 1
          done
          echo "backend did not become healthy in time"
          exit 1

      - name: Create e2e admin user
        run: |
          docker compose -f ci/docker-compose.ci.yml exec -T \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            backend npx tsx scripts/create-admin.ts

      # The Chromium download is the same on every run for a given Playwright
      # version, so it is cached on the e2e lock file.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium on a cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install chromium

      # The ubuntu-latest image already carries Chromium's system libraries,
      # so `playwright install-deps` is skipped: its apt step took from 7 s to
      # 317 s and was the main source of slow shards. If a runner image ever
      # drops a library, the launch check fails and the apt step runs.
      - name: Check Chromium launches (apt fallback)
        working-directory: e2e
        run: |
          node -e "require('@playwright/test').chromium.launch().then(b => b.close())" \
            || npx playwright install-deps chromium

      - name: Run Playwright tests (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          CI: "true"
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f ci/docker-compose.ci.yml logs --no-color --tail 100

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
