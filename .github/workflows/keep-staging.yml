name: Keep staging

# The repository deletes a merged PR's head branch automatically, which keeps
# feature branches tidy but also deletes `staging` when a staging -> main
# release PR merges. Branch protection, which would exempt it, is not
# available on this plan. So when a release PR from `staging` merges into
# `main`, put `staging` back at the commit that was merged.
#
# The ref is created with the workflow token, and GitHub does not start
# workflows for events caused by that token: recreating `staging` triggers no
# CI run and no staging redeploy (that commit was already tested and deployed).
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: keep-staging
  cancel-in-progress: false

jobs:
  restore-staging:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'staging' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recreate staging at the merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The automatic deletion happens at merge time but is not ordered
          # with this job. Wait until the branch is gone, so recreating it
          # cannot race the deletion and lose. If it never goes (the setting
          # was turned off), there is nothing to restore.
          for _ in $(seq 1 12); do
            if ! gh api "repos/$REPO/git/ref/heads/staging" >/dev/null 2>&1; then
              gh api -X POST "repos/$REPO/git/refs" \
                -f ref=refs/heads/staging -f sha="$SHA" >/dev/null
              echo "Recreated staging at $SHA."
              exit 0
            fi
            sleep 5
          done
          echo "staging still exists; nothing to restore."
