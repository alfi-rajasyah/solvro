# Monthly, grouped dependency-update PRs.
#
# This file governs *version* updates only. Security updates are a repository
# setting and are unaffected by anything here — they keep arriving one PR per
# advisory, promptly and ungrouped, which is the behaviour we want for them.
#
# Tuning rationale: one PR per package per week was unusable noise (nine PRs
# landed in a single sweep, none of which closed a security alert). Each
# ecosystem is now collapsed into a single grouped PR per month, with the
# open-PR ceiling dropped from 5 to 2. Minor and patch bumps are grouped
# together; majors are deliberately left ungrouped so they arrive on their
# own and can be accepted or closed as individual decisions.
#
# Majors are NOT added to an `ignore` list on purpose: `ignore` rules can also
# suppress *security* updates for the same package, and some security fixes
# only exist behind a major (react-router's advisories need v7). Silencing
# majors here would hide those.
#
# No `target-branch` here on purpose. develop is the repository's default
# branch, so version updates and security updates both already land on it.
# main stays the release branch and only advances via develop→main release
# PRs — a convention this file has no say over either way.
#
# `target-branch: develop` used to be set on every entry, from when main was
# the default branch. It never worked for security updates: those always
# target the default branch and ignore the option, which is why security PRs
# were opened against main regardless. Worse, once the default branch moved
# to develop, Dependabot read it as describing a non-default branch and
# disowned all 8 open PRs — "The dependabot.yml entry that created this PR
# has been deleted so this PR can't be rebased" — leaving them impossible to
# rebase or retarget, only to close and recreate. Omitting it keeps both
# update kinds on one branch and avoids repeating that.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      e2e-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend-docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
