# Browser security headers for every page and static file nginx serves
# (docs/archive/plans/application-review-2026-10-22.md, F-06 / B-06).
#
# nginx drops every server-level add_header in a location that has its own
# add_header, so this file is included in each non-API location instead of
# once at server level. The /api/ locations get theirs from the backend
# (helmet) and are left alone. Needs $solvro_referrer_policy, which
# nginx.conf sets per server and per location (no-referrer on /share/).
#
# CSP sources, and why each is allowed:
#   script-src  accounts.google.com/gsi/client   Google sign-in button
#   style-src   'unsafe-inline'                  React/Base-UI positioning and
#                                                library-injected <style> tags
#               fonts.googleapis.com             Source Sans 3 + Material Symbols
#               accounts.google.com/gsi/style    Google sign-in button
#   font-src    fonts.gstatic.com                the two Google font families
#   img-src     *.googleusercontent.com          Google profile pictures
#               data: blob:                      inline icons, export previews
#   connect-src / frame-src accounts.google.com/gsi/   Google sign-in
#   connect-src fonts.googleapis.com, fonts.gstatic.com   the service worker
#                                                fetches and caches the fonts
#                                                itself (vite.config.ts
#                                                runtimeCaching), and a worker's
#                                                fetch() falls under connect-src
#   worker-src  'self'                           the PWA service worker
# HSTS is not added here. The backend's helmet already sends
# Strict-Transport-Security (max-age=31536000; includeSubDomains) on every
# /api/ response, which pins the host as soon as the app calls the API over
# HTTPS (docs/CONFIGURATION.md 2.6).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/ https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy $solvro_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
