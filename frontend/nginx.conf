server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # Pipeline (Velora) proxy: strips /pipeline-api, forwards to Velora's /api.
  # Uses Docker's embedded DNS resolver with a variable upstream instead of a
  # static proxy_pass, so nginx does NOT fail to start (or fail every request)
  # when the velora-app container is absent or not yet up — Solvro's own
  # dashboard must keep serving even if the Pipeline module is down.
  location /pipeline-api/ {
    resolver 127.0.0.11 valid=30s;
    set $velora_upstream velora-app:3000;
    rewrite ^/pipeline-api/(.*)$ /api/$1 break;
    proxy_pass http://$velora_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
    # proxy_redirect default doesn't work with a variable proxy_pass, so
    # rewrite Velora's own Location headers (trailing-slash redirects, its
    # /login middleware bounce) back under our /pipeline-api namespace —
    # otherwise a client following the redirect lands on a bare Solvro path.
    proxy_redirect /api/ /pipeline-api/;
    proxy_redirect /api /pipeline-api;
    # Never let nginx's own trailing-slash 301 leak the internal scheme —
    # this proxy sits behind TLS termination in prod.
    absolute_redirect off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Service worker must be revalidated on every load so updates propagate
  # promptly — never let an intermediary or the browser cache a stale one.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Manifest is small and can change (icons/theme); serve with the correct
  # type and no long-lived cache so PWA installs pick up updates.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
